<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      margin: 0;
      background: #F8F8F9;
      color: #111439;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .logo {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: #111439;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 12px;
    }
    h2 {
      font-size: 14px;
      font-weight: 800;
      margin: 0;
    }
    p {
      font-size: 12px;
      color: #425466;
      line-height: 1.4;
      margin: 0 0 12px 0;
    }
    .status-badge {
      display: inline-block;
      background: #dcfce7;
      color: #15803d;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 12px;
      margin-bottom: 12px;
    }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      background: #111439;
      color: white;
      text-align: center;
      padding: 10px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .btn:hover {
      background: #0A2540;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">✦</div>
    <h2>PDFCraft Status Saver</h2>
  </div>
  <span class="status-badge">● Active on WhatsApp Web</span>
  <p>Open <b>web.whatsapp.com</b>, view any friend's status, and click the green <b>"Download HD Status"</b> button!</p>
  <a href="https://web.whatsapp.com" target="_blank" class="btn">Open WhatsApp Web &gt;</a>
  <a href="https://pdf-craft-vert.vercel.app" target="_blank" style="display:block; text-align:center; font-size:11px; color:#6366f1; text-decoration:none; font-weight:600;">Visit PDFCraft Tools</a>
</body>
</html>
